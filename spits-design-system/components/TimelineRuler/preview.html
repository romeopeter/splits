<!-- @dsCard group="Timeline" height=330 subtitle="Ruler, tracks and playhead assembled" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;padding:20px;background:var(--bg-panel);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:grid;gap:16px}.trio{display:flex;gap:8px}.trio>*{flex:1;min-width:0}
.lbl{font:500 13px/18px var(--font-sans);color:var(--text-secondary);margin:0 0 8px}
.foot{background:linear-gradient(135deg,#2b2118,#6a4a2d 55%,#1a1410);border-radius:12px;position:relative}</style></head><body><div id="r" class="sp"></div><script>
const h=React.createElement,S=window.Spits;
function TL(){
 const pps=14.4, W=75*pps;
 const [t,setT]=React.useState(18);
 return h('div',{style:{display:'grid',gridTemplateColumns:'180px 1fr',background:'var(--bg-timeline)',margin:-20,overflow:'hidden'}},
  h('div',null, h('div',{style:{height:28,borderBottom:'1px solid var(--border-subtle)',background:'var(--bg-panel)',display:'flex',alignItems:'center',padding:'0 12px',gap:8,font:'500 12px/16px var(--font-sans)',color:'var(--text-secondary)'}}, h(S.Icon,{name:'plus',size:16}),'Add track'), ['Track 1','Track 2','Track 3','Track 4','Track 5'].map(function(n,i){return h(S.TrackHeader,{key:n,name:n,locked:i===0});})),
  h('div',{style:{position:'relative',overflow:'hidden'}},
   h(S.TimelineRuler,{seconds:75,pxPerSecond:pps,time:t,onSeek:setT}),
   h(S.TrackLane,{width:W,label:'Track 1'}, h(S.Clip,{kind:'shape',label:'S\u2026',left:0,width:52}), h(S.Clip,{kind:'shape',label:'Shape',left:58,width:130})),
   h(S.TrackLane,{width:W,label:'Track 2'}, h(S.Clip,{kind:'text',label:'Microsoft Surface for\u2026',left:58,width:130}), h(S.Clip,{kind:'text',label:'*Some a s\u2026',left:290,width:100,selected:true})),
   h(S.TrackLane,{width:W,label:'Track 3'}, h(S.Clip,{kind:'caption',label:'Subtitles',left:190,width:640})),
   h(S.TrackLane,{width:W,label:'Track 4'}, h(S.Clip,{kind:'video',label:'Video',left:190,width:640}), h(S.Clip,{kind:'video',label:'Video 2',left:838,width:230})),
   h(S.TrackLane,{width:W,label:'Track 5'}, h(S.Clip,{kind:'audio',label:'Perfect Wave.mp3',left:0,width:830,seed:5}), h(S.Clip,{kind:'audio',label:'Ambient.mp3',left:838,width:230,seed:9})),
   h(S.Playhead,{x:t*pps})));
}
ReactDOM.createRoot(document.getElementById('r')).render(h(TL));
</script></body></html>
