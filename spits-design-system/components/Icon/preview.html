<!-- @dsCard group="Brand" height=420 subtitle="The 44-glyph editor icon set in one 24px grid" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;padding:20px;background:var(--bg-panel);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:grid;gap:16px}.trio{display:flex;gap:8px}.trio>*{flex:1;min-width:0}
.lbl{font:500 13px/18px var(--font-sans);color:var(--text-secondary);margin:0 0 8px}
.foot{background:linear-gradient(135deg,#2b2118,#6a4a2d 55%,#1a1410);border-radius:12px;position:relative}</style></head><body><div id="r" class="sp"></div><script>
const h=React.createElement,S=window.Spits;

ReactDOM.createRoot(document.getElementById('r')).render(h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(88px,1fr))',gap:12}}, ["add", "alert", "align-center", "align-justify", "align-left", "align-right", "captions", "check", "chevron-down", "close", "collapse", "effects", "export", "eye", "eye-off", "grip", "help", "image", "info", "lock", "menu", "minus", "music", "pan", "pause", "play", "plus", "redo", "select", "settings", "shapes", "share", "skip-back", "skip-forward", "split", "text", "trash", "trim", "undo", "unlock", "video", "volume", "warning", "zoom-in"].map(function(n){return h('div',{key:n,style:{display:'grid',justifyItems:'center',gap:6,color:'var(--text-primary)'}}, h(S.Icon,{name:n,size:24}), h('span',{style:{font:'400 12px/16px var(--font-sans)',color:'var(--text-muted)'}},n));})));
</script></body></html>
