<!-- @dsCard group="Layout" height=780 subtitle="Floating inspector with titled sections and labelled rows" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;padding:20px;background:var(--bg-panel);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:grid;gap:16px}.trio{display:flex;gap:8px}.trio>*{flex:1;min-width:0}
.lbl{font:500 13px/18px var(--font-sans);color:var(--text-secondary);margin:0 0 8px}
.foot{background:linear-gradient(135deg,#2b2118,#6a4a2d 55%,#1a1410);border-radius:12px;position:relative}</style></head><body><div id="r" class="sp"></div><script>
const h=React.createElement,S=window.Split;

ReactDOM.createRoot(document.getElementById('r')).render(h(S.Panel,{title:'Typography',onCollapse:function(){}},
 h(S.PanelSection,null, h(S.Field,{label:'Text content',multiline:true,value:'*Some apps sold separately'})),
 h(S.PanelSection,null,
  h(S.PanelRow,{label:'Text'}, h(S.Select,{label:'Font family',value:'Hanken Grotesk',options:['Hanken Grotesk','System UI']}), h('div',{className:'trio'}, h(S.Field,{label:'Size',caption:'Size',value:'12',unit:'px'}), h(S.Field,{label:'Spacing',caption:'Spacing',value:'0',stepper:true}), h(S.Field,{label:'Line height',caption:'Height',value:'1.00',stepper:true}))),
  h(S.PanelRow,{label:'Weight'}, h(S.Select,{label:'Font weight',value:'Regular',options:['Light','Regular','Medium','Bold']})),
  h(S.PanelRow,{label:'Align'}, h(S.SegmentedControl,{label:'Text alignment',defaultValue:'right',options:[{value:'left',icon:'align-left',label:'Align left'},{value:'center',icon:'align-center',label:'Align center'},{value:'right',icon:'align-right',label:'Align right'},{value:'justify',icon:'align-justify',label:'Justify'}]})),
  h(S.PanelRow,{label:'Case'}, h(S.SegmentedControl,{label:'Letter case',defaultValue:'upper',options:[{value:'none',text:'\u2013',label:'Original case'},{value:'upper',text:'AG',label:'Uppercase'},{value:'lower',text:'ag',label:'Lowercase'},{value:'title',text:'Ag',label:'Title case'}]}))),
 h(S.PanelSection,null, h(S.PanelRow,{label:'Position',inline:true}, h(S.Field,{label:'X position',value:'960',unit:'x'}), h(S.Field,{label:'Y position',value:'64',unit:'y'}), h(S.Field,{label:'Rotation',value:'0\u00b0'}))),
 h(S.PanelSection,null,
  h(S.PanelRow,{label:'Color'}, h(S.ColorField,{label:'Text colour',value:'#E2CF23',opacity:60})),
  h(S.PanelRow,{label:'Border'}, h(S.Button,{variant:'secondary',iconEnd:'plus',style:{justifyContent:'space-between'}},'Add')),
  h(S.PanelRow,{label:'Shadow'}, h(S.ColorField,{label:'Shadow colour',value:'#000000',opacity:40})))));
</script></body></html>
