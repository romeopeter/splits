<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}body{background:var(--bg-app);width:960px;height:288px;overflow:hidden}
.cover{position:relative;width:960px;height:288px;background:var(--bg-app);font-family:var(--font-sans)}
svg{position:absolute;left:0;top:0}
.vid{fill:var(--clip-video)}.acc{fill:var(--accent)}.cap{fill:var(--clip-caption)}.txt{fill:var(--clip-text)}.aud{fill:var(--clip-audio)}
.blk{rx:var(--radius-md)}
.tick{stroke:var(--text-muted);stroke-width:1}
.ph{stroke:var(--playhead);stroke-width:2}.phh{fill:var(--playhead)}
.name{position:absolute;left:40px;bottom:68px;margin:0;font:700 120px/.92 var(--font-sans);letter-spacing:-.02em;color:var(--text-primary)}
.tag{position:absolute;left:44px;bottom:36px;margin:0;font:400 14px/20px var(--font-sans);color:var(--text-muted)}
</style></head><body><div class="cover">
<!-- derivation: blocks = accent, clip-caption, clip-video, clip-text, clip-audio as five tracks, 40px tall (size-track-row), gap space-8, corners radius-md, unequal lengths bleeding off the right edge.
arrangement = a timeline: five horizontal clips cut by one playhead at x=744; right pieces slide up 6px against the left pieces, the same slice as the logo.
pattern = ruler ticks every space-16 along the top (precise, technical, timeline-native), long tick every fifth; the system is about time and cutting, so the ruler is the row that is most Split.
steps and radii: space-8, space-16, size-track-row 40px, radius-md 8px. -->
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
 <g class="tick">
  <path d="M488 8v6M504 8v6M520 8v6M536 8v6M552 8v10M568 8v6M584 8v6M600 8v6M616 8v6M632 8v10M648 8v6M664 8v6M680 8v6M696 8v6M712 8v10M728 8v6M760 8v6M776 8v6M792 8v10M808 8v6M824 8v6M840 8v6M856 8v6M872 8v10M888 8v6M904 8v6M920 8v6M936 8v6M952 8v10"/>
 </g>
 <g transform="translate(0 3)">
  <rect class="blk vid" x="512" y="32" width="224" height="40"/><rect class="blk vid" x="752" y="26" width="208" height="40"/>
  <rect class="blk acc" x="480" y="80" width="256" height="40"/><rect class="blk acc" x="752" y="74" width="120" height="40"/>
  <rect class="blk cap" x="560" y="128" width="176" height="40"/><rect class="blk cap" x="752" y="122" width="208" height="40"/>
  <rect class="blk txt" x="480" y="176" width="144" height="40"/><rect class="blk txt" x="784" y="170" width="176" height="40"/>
  <rect class="blk aud" x="520" y="224" width="216" height="40"/><rect class="blk aud" x="752" y="218" width="144" height="40"/>
 </g>
 <path class="ph" d="M744 14V282"/><path class="phh" d="M736 2h16v8l-8 7-8-7z"/>
</svg>
<h1 class="name">Split</h1><p class="tag">Cut clean. Build fast.</p>
</div></body></html>
