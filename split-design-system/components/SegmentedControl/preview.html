<!-- @dsCard group="Inputs" height=130 subtitle="Single-choice group for alignment and case" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;padding:20px;background:var(--bg-panel);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:grid;gap:16px}.trio{display:flex;gap:8px}.trio>*{flex:1;min-width:0}
.lbl{font:500 13px/18px var(--font-sans);color:var(--text-secondary);margin:0 0 8px}
.foot{background:linear-gradient(135deg,#2b2118,#6a4a2d 55%,#1a1410);border-radius:12px;position:relative}</style></head><body><div id="r" class="sp"></div><script>
const h=React.createElement,S=window.Split;

ReactDOM.createRoot(document.getElementById('r')).render(h('div',{className:'col',style:{maxWidth:300}},
 h(S.SegmentedControl,{label:'Text alignment',defaultValue:'right',options:[{value:'left',icon:'align-left',label:'Align left'},{value:'center',icon:'align-center',label:'Align center'},{value:'right',icon:'align-right',label:'Align right'},{value:'justify',icon:'align-justify',label:'Justify'}]}),
 h(S.SegmentedControl,{label:'Letter case',defaultValue:'upper',options:[{value:'none',text:'\u2013',label:'Original case'},{value:'upper',text:'AG',label:'Uppercase'},{value:'lower',text:'ag',label:'Lowercase'},{value:'title',text:'Ag',label:'Title case'}]})));
</script></body></html>
